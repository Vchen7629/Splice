name: CI workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  path-filter:
    runs-on: ubuntu-latest
    outputs:
        frontend: ${{ steps.changes.outputs.frontend }}
        scene_detector: ${{ steps.changes.outputs.scene_detector }}
        video_upscaling: ${{ steps.changes.outputs.video_upscaling }}
        shared_python: ${{ steps.changes.outputs.shared_python }}
        gateway: ${{ steps.changes.outputs.gateway }}
        transcoder: ${{ steps.changes.outputs.transcoder }}
        recombiner: ${{ steps.changes.outputs.recombiner }}
        shared_go: ${{ steps.changes.outputs.shared_go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'frontend/**'
            scene_detector:
              - 'python_services/scene-detector/**'
            video_upscaling:
              - 'python_services/video-upscaling/**'
            shared_python:
              - 'python_services/shared/**'
            gateway:
              - 'go_services/cmd/gateway/**'
              - 'go_services/internal/gateway/**'
              - 'go_services/go.mod'
              - 'go_services/go.sum'
            transcoder:
              - 'go_services/cmd/transcoder/**'
              - 'go_services/internal/transcoder/**'
              - 'go_services/go.mod'
              - 'go_services/go.sum'
            recombiner:
              - 'go_services/cmd/recombiner/**'
              - 'go_services/internal/recombiner/**'
              - 'go_services/go.mod'
              - 'go_services/go.sum'
            shared_go:
              - 'go_services/internal/shared/**'

  frontend-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '>=23.6.1'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --dev

      - name: Run Linting
        working-directory: frontend
        run: npm run lint

  scene-detector-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.scene_detector == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ffmpeg dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: ./python_services/scene-detector

      - name: Run Linter and Formatting
        run: |
          uv run ruff check .
          uv run ruff format --check
        working-directory: ./python_services/scene-detector

      - name: Run Type Checking
        run: uv run pyrefly check
        working-directory: ./python_services/scene-detector

      - name: Run Unit/Integration Tests
        run: make test_all
        working-directory: ./python_services/scene-detector

  video-upscaling-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.video_upscaling == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: ./python_services/video-upscaling

      - name: Run Linter and Formatting
        run: |
          uv run ruff check .
          uv run ruff format --check
        working-directory: ./python_services/video-upscaling

      - name: Run Type Checking
        run: uv run pyrefly check
        working-directory: ./python_services/video-upscaling

      - name: Run Unit/Integration Tests
        run: make test_all
        working-directory: ./python_services/video-upscaling

  shared-python-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.shared_python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the project
        run: uv sync --locked --all-extras --dev
        working-directory: ./python_services/shared

      - name: Run Linter and Formatting
        run: |
          uv run ruff check .
          uv run ruff format --check
        working-directory: ./python_services/shared

      - name: Run Type Checking
        run: uv run pyrefly check
        working-directory: ./python_services/shared

      - name: Run Unit/Integration Tests
        run: make test_all
        working-directory: ./python_services/shared

  gateway-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.gateway == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go_services/go.mod'
          cache: 'true'

      - name: Download Go modules
        working-directory: ./go_services
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: ./go_services/cmd/gateway

      - name: run tests
        working-directory: ./go_services/cmd/gateway
        run: make test_all

  transcoder-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.transcoder == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go_services/go.mod'
          cache: 'true'

      - name: Install ffmpeg dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Go modules
        working-directory: ./go_services
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: ./go_services/cmd/transcoder

      - name: run tests
        working-directory: ./go_services/cmd/transcoder
        run: make test_all

  recombiner-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.recombiner == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go_services/go.mod'
          cache: 'true'

      - name: Install ffmpeg dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Go modules
        working-directory: ./go_services
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: ./go_services/cmd/recombiner

      - name: run tests
        working-directory: ./go_services/cmd/recombiner
        run: make test_all

  shared-go-ci:
    needs: path-filter
    if: ${{ github.event_name == 'pull_request' && needs.path-filter.outputs.shared_go == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go_services/go.mod'
          cache: 'true'

      - name: Download Go modules
        working-directory: ./go_services
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          working-directory: ./go_services/cmd/shared

      - name: run tests
        working-directory: ./go_services/cmd/shared
        run: make test_all

  coverage:
    needs: path-filter
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && (
        needs.path-filter.outputs.scene_detector == 'true' ||
        needs.path-filter.outputs.video_upscaling == 'true' ||
        needs.path-filter.outputs.shared_python == 'true' ||
        needs.path-filter.outputs.gateway == 'true' ||
        needs.path-filter.outputs.transcoder == 'true' ||
        needs.path-filter.outputs.recombiner == 'true' ||
        needs.path-filter.outputs.shared_go == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ffmpeg dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install scene-detector project
        run: uv sync --locked --all-extras --dev
        working-directory: ./python_services/scene-detector

      - name: Run scene-detector coverage
        working-directory: ./python_services/scene-detector
        run: make coverage

      - name: Install video-upscaling project
        run: uv sync --locked --all-extras --dev
        working-directory: ./python_services/video-upscaling

      - name: Run video-upscaling coverage
        working-directory: ./python_services/video-upscaling
        run: make coverage

      - name: Install shared-python project
        run: uv sync --locked --all-extras --dev
        working-directory: ./python_services/shared

      - name: Run shared-python coverage
        working-directory: ./python_services/shared
        run: make coverage

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go_services/go.mod'
          cache: 'true'

      - name: Download Go modules
        working-directory: ./go_services
        run: go mod download

      - name: Run gateway coverage
        working-directory: ./go_services/cmd/gateway
        run: make coverage

      - name: Run transcoder coverage
        working-directory: ./go_services/cmd/transcoder
        run: make coverage

      - name: Run recombiner coverage
        working-directory: ./go_services/cmd/recombiner
        run: make coverage

      - name: Run shared-go coverage
        working-directory: ./go_services/cmd/shared
        run: make coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: |
            ./go_services/cmd/gateway/coverage.out,
            ./go_services/cmd/transcoder/coverage.out,
            ./go_services/cmd/recombiner/coverage.out,
            ./go_services/cmd/shared/coverage.out,
            ./python_services/scene-detector/coverage.xml,
            ./python_services/video-upscaling/coverage.xml,
            ./python_services/shared/coverage.xml,
          token: ${{ secrets.CODECOV_TOKEN }}
