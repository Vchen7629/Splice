services:
  video-upscaling:
    image: video-upscaler:latest
    pull_policy: never
    ports:
      - "127.0.0.1:9101:9101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./python_services
      dockerfile: video-upscaling/dockerfile
    environment:
      - BASE_STORAGE_URL=http://host.docker.internal:8888
      - NATS_URL=nats://host.docker.internal:4222
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]
  
  scene-detector:
    image: scene-detector:latest
    pull_policy: never
    ports:
      - "127.0.0.1:9098:9098"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./python_services
      dockerfile: scene-detector/dockerfile
    environment:
      - BASE_STORAGE_URL=http://host.docker.internal:8888
      - NATS_URL=nats://host.docker.internal:4222
  
  gateway:
    image: gateway:latest
    pull_policy: never
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./go_services
      dockerfile: cmd/gateway/dockerfile
    environment:
      - SCENE_DETECTOR_URL=http://scene-detector:9098
      - CHUNK_WORKER_URL=http://chunk-worker:9095
      - RECOMBINER_URL=http://recombiner:9090
      - VIDEO_UPSCALING_URL=http://video-upscaling:9101
      - FORMAT_CONVERTER_URL=http://format-converter:9099
      - BASE_STORAGE_URL=http://host.docker.internal:8888
      - NATS_URL=nats://host.docker.internal:4222
  
  chunk-worker:
    image: chunkworker:latest
    pull_policy: never
    ports:
      - "127.0.0.1:9095:9095"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./go_services
      dockerfile: cmd/chunkworker/dockerfile
    environment:
      - BASE_STORAGE_URL=http://host.docker.internal:8888
      - NATS_URL=nats://host.docker.internal:4222
  
  recombiner:
    image: recombiner:latest
    pull_policy: never
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./go_services
      dockerfile: cmd/recombiner/dockerfile
    environment:
      - BASE_STORAGE_URL=http://host.docker.internal:8888
      - NATS_URL=nats://host.docker.internal:4222
    
  format-converter:
    image: converter:latest
    pull_policy: never
    ports:
      - "127.0.0.1:9099:9099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./go_services
      dockerfile: cmd/converter/dockerfile
    environment:
      - BASE_STORAGE_URL=http://host.docker.internal:8888
      - NATS_URL=nats://host.docker.internal:4222
  
  
